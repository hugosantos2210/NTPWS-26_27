<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="20" height="14">
  <!-- Horizontal Tricolor: Red, White, Blue -->
  <rect width="60" height="13.33" fill="#FF0000"/>
  <rect y="13.33" width="60" height="13.33" fill="#FFFFFF"/>
  <rect y="26.66" width="60" height="13.34" fill="#0C4076"/>
  <!-- Croatian Coat of Arms (Grb) -->
  <g transform="translate(24, 7) scale(0.6)">
    <!-- Crown -->
    <path d="M 0,6 L 4,0 L 8,6 L 12,0 L 16,6 L 20,0 L 20,8 L 0,8 Z" fill="#0C4076"/>
    <circle cx="2" cy="3" r="1.5" fill="#FFCC00"/>
    <circle cx="10" cy="3" r="1.5" fill="#FF0000"/>
    <circle cx="18" cy="3" r="1.5" fill="#FFCC00"/>
    <!-- Shield background -->
    <path d="M 0,8 L 20,8 L 20,22 C 20,29 10,34 10,34 C 10,34 0,29 0,22 Z" fill="#FFFFFF" stroke="#FF0000" stroke-width="1"/>
    <!-- Chequy 5x5 -->
    <g fill="#FF0000">
      <!-- Row 1 -->
      <rect x="0" y="8" width="4" height="4"/>
      <rect x="8" y="8" width="4" height="4"/>
      <rect x="16" y="8" width="4" height="4"/>
      <!-- Row 2 -->
      <rect x="4" y="12" width="4" height="4"/>
      <rect x="12" y="12" width="4" height="4"/>
      <!-- Row 3 -->
      <rect x="0" y="16" width="4" height="4"/>
      <rect x="8" y="16" width="4" height="4"/>
      <rect x="16" y="16" width="4" height="4"/>
      <!-- Row 4 -->
      <rect x="4" y="20" width="4" height="4"/>
      <rect x="12" y="20" width="4" height="4"/>
      <!-- Row 5 (bottom) -->
      <rect x="8" y="24" width="4" height="4"/>
    </g>
  </g>
</svg>
