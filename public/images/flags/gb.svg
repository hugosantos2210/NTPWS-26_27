<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="20" height="14">
  <clipPath id="s">
    <path d="M0,0 v40 h60 v-40 z"/>
  </clipPath>
  <clipPath id="t">
    <path d="M30,20 L60,40 H0 Z M30,20 L60,0 H0 Z"/>
  </clipPath>
  <!-- Blue background -->
  <rect width="60" height="40" fill="#012169"/>
  <!-- White diagonal cross -->
  <path d="M0,0 L60,40 M60,0 L0,40" stroke="#FFFFFF" stroke-width="8"/>
  <!-- Red diagonal cross -->
  <path d="M0,0 L60,40 M60,0 L0,40" clip-path="url(#t)" stroke="#C8102E" stroke-width="4"/>
  <!-- White central cross -->
  <path d="M30,0 v40 M0,20 h60" stroke="#FFFFFF" stroke-width="12"/>
  <!-- Red central cross -->
  <path d="M30,0 v40 M0,20 h60" stroke="#C8102E" stroke-width="8"/>
</svg>
